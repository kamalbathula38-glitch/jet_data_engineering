x-airflow-common: &airflow-common
  image: apache/airflow:2.10.3-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Dev/test-only convenience (not constraint-checked against Airflow's own
    # pins) - fine for this local demo, not something to run in production.
    _PIP_ADDITIONAL_REQUIREMENTS: "requests psycopg[binary] pydantic PyYAML python-dotenv dbt-core dbt-postgres"
    JET_PROJECT_ROOT: /opt/jet_data_engineering
    # Used by ingestion/base_ingestion.py & handlers/postgres.py inside this
    # container. python-dotenv's load_dotenv() never overrides an already-set
    # env var, so this takes precedence over whatever DATABASE_URL is in .env.
    DATABASE_URL: postgresql://xkcd:xkcd@warehouse:5432/xkcd
    # Overrides the host-side defaults baked into
    # dbt_project/jet_analytics/profiles.yml, so dbt running in this
    # container (which `cd`s there and picks up that co-located profiles.yml
    # automatically) reaches the warehouse over the Docker network instead.
    DBT_HOST: warehouse
    DBT_PORT: "5432"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./:/opt/jet_data_engineering
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    warehouse:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: xkcd
      POSTGRES_PASSWORD: xkcd
      POSTGRES_DB: xkcd
    ports:
      - "5433:5432"
    volumes:
      - warehouse-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "xkcd"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true
    depends_on: *airflow-common-depends-on

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
  warehouse-db-volume:
  airflow-logs:
