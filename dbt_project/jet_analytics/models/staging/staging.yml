version: 2

models:
  - name: stg_xkcd
    description: "Cleaned staging model for XKCD comic metadata."

    columns:
      - name: comic_num
        description: "Unique XKCD comic number."
        data_tests:
          - unique
          - not_null

      - name: title
        data_tests:
          - not_null

      - name: image_url
        data_tests:
          - not_null