version: 2

models:
  - name: dim_comic
    description: "Dimension table containing descriptive information about XKCD comics."
    config:
      tags: ['xkcd_analytics']
    columns:
      - name: comic_num
        description: "Unique identifier for each comic."
        data_tests:
          - unique
          - not_null

      - name: title
        data_tests:
          - not_null

      - name: image_url
        data_tests:
          - not_null

  - name: fact_comic_metrics
    description: "Fact table containing cost, views, and customer review metrics for each XKCD comic."
    config:
      tags: ['xkcd_analytics']
    columns:
      - name: comic_num
        description: "Unique identifier for each comic; foreign key to dim_comic."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_comic')
                field: comic_num

      - name: creation_cost_eur
        description: "Letters in the title multiplied by 5 EUR per letter."
        data_tests:
          - not_null
          - value_between:
              arguments:
                min_value: 0
                max_value: 10000

      - name: views
        description: "Random value between 0 and 10000."
        data_tests:
          - not_null
          - value_between:
              arguments:
                min_value: 0
                max_value: 10000

      - name: customer_review_score
        description: "Random value between 1.0 and 10.0."
        data_tests:
          - not_null
          - value_between:
              arguments:
                min_value: 1.0
                max_value: 10.0